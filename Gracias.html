<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro Exitoso - Mesa Pública PAE</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #f4f6f9;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card {
      border: none;
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.08);
      max-width: 500px;
      width: 100%;
    }
    .check-icon {
      width: 80px;
      height: 80px;
      background-color: #d1e7dd;
      color: #0f5132;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 1.5rem auto;
      font-size: 2.5rem;
    }
  </style>
</head>
<body>

<div class="container py-4">
  <div class="card p-4 p-md-5 text-center mx-auto">
    <div class="check-icon">✓</div>
    <h2 class="fw-bold text-success mb-3">¡Gracias por su asistencia!</h2>
    <p class="text-secondary mb-4">
      Su registro para la <strong>Mesa Pública del Programa de Alimentación Escolar (PAE)</strong> ha sido guardado exitosamente.
    </p>
    <a href="index.html" class="btn btn-outline-primary py-2 fw-semibold">
      Registrar otra persona
    </a>
  </div>
</div>

</body>
</html>
