<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro Exitoso - Mesa Pública PAE</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --pae-green-header: #174d38;
      --pae-green-btn: #1f6b45;
      --pae-green-hover: #154e32;
      --pae-bg: #f8fafc;
    }
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--pae-bg);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      margin: 0;
    }
    .top-nav {
      background-color: #0f3627;
      color: #cbd5e1;
      font-size: 0.85rem;
      padding: 10px 24px;
    }
    .card-gracias {
      background: #ffffff;
      border-radius: 18px;
      border: 1px solid #e2e8f0;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
      padding: 48px 32px;
      max-width: 520px;
      margin: auto;
      text-align: center;
    }
    .check-circle {
      width: 76px;
      height: 76px;
      background-color: #d1fae5;
      color: #065f46;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px auto;
      font-size: 2.4rem;
      font-weight: 700;
    }
    .btn-regresar {
      background-color: var(--pae-green-btn);
      border: none;
      color: #ffffff;
      font-weight: 600;
      padding: 10px 24px;
      border-radius: 8px;
      text-decoration: none;
      display: inline-block;
      transition: background-color 0.2s ease;
    }
    .btn-regresar:hover {
      background-color: var(--pae-green-hover);
      color: #ffffff;
    }
  </style>
</head>
<body>

  <div class="top-nav d-flex justify-content-between align-items-center">
    <span>PAE 2026 — Sistema de Asistencia</span>
    <span class="small opacity-75">Gobernación de Antioquia</span>
  </div>

  <div class="container py-5 my-auto">
    <div class="card-gracias">
      <div class="check-circle">✓</div>
      <h3 class="fw-bold text-dark mb-2">¡Gracias por su asistencia!</h3>
      <p class="text-secondary mb-4" style="font-size: 0.95rem;">
        Su registro para la <strong>Segunda Mesa Pública PAE 2026</strong> ha sido recibido y almacenado correctamente en el sistema.
      </p>
      <a href="index.html" class="btn btn-regresar">
        Registrar otra persona
      </a>
    </div>
  </div>

  <footer class="text-center py-3 text-muted small">
    © 2026 Programa de Alimentación Escolar — Sitio de Asistencia.
  </footer>

</body>
</html>
