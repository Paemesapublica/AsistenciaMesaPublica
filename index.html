          <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold" id="btnSubmit">

          </button>
        </form>

        <div id="alerta" class="alert mt-3 d-none" role="alert"></div>

<script>
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwa-xb8iHxuRyjQG7nOaYxTOdNqb9PJy4HqBiRS2Sd4HZGZ8xGM8se2OogxO8stcpxgqQ/exec";

  const form = document.getElementById('attendanceForm');
  const btnSubmit = document.getElementById('btnSubmit');
  const alerta = document.getElementById('alerta');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    
    btnSubmit.disabled = true;
    btnSubmit.innerText = "Guardando...";
    alerta.classList.add('d-none');

    const formData = new FormData(form);
    const payload = Object.fromEntries(formData.entries());

    try {
      await fetch(SCRIPT_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: {
          'Content-Type': 'text/plain;charset=utf-8'
        },
        body: JSON.stringify(payload)
      });

      alerta.className = "alert alert-success mt-3";
      alerta.textContent = "¡Registro exitoso! Su asistencia ha sido guardada.";
      alerta.classList.remove('d-none');
      form.reset();

    } catch (err) {
      alerta.className = "alert alert-danger mt-3";
      alerta.textContent = "Ocurrió un error al procesar el registro. Intente nuevamente.";
      alerta.classList.remove('d-none');
    } finally {
      btnSubmit.disabled = false;
      btnSubmit.innerText = "Registrar Asistencia";
    }
  });
</script>
